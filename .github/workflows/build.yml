name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core + web server tests
        run: |
          set -o pipefail
          swift test --package-path Packages/PadTrackCore 2>&1 | tee core-tests.log

      - name: Web client tests
        run: |
          set -o pipefail
          node --test WebClientTests/*.test.mjs 2>&1 | tee web-client-tests.log

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Mac app
        run: |
          set -o pipefail
          xcodebuild -project PadTrack.xcodeproj -scheme PadTrack-Mac -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee mac-build.log

      - name: Build iPad app
        run: |
          set -o pipefail
          xcodebuild -project PadTrack.xcodeproj -scheme PadTrack-iPad -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ipad-build.log

      - name: Report
        if: always()
        run: bash .github/scripts/annotate.sh core-tests.log web-client-tests.log mac-build.log ipad-build.log
