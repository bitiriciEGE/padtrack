name: release

# A "v*" tag (e.g. v0.1.0) builds the Mac app and publishes it on GitHub Releases.
# Pushing a change to this file on web-client runs everything except publishing (dry run).
on:
  push:
    tags: ["v*"]
    branches: [web-client]
    paths: [".github/workflows/release.yml", ".github/release-notes.md"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dryrun.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=PadTrack-$VERSION-macOS.zip" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          set -o pipefail
          { swift test --package-path Packages/PadTrackCore && node --test WebClientTests/*.test.mjs; } 2>&1 | tee release-tests.log

      - name: Build Mac app (Release, Apple Silicon + Intel)
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project PadTrack.xcodeproj -scheme PadTrack-Mac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION%%-*}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build 2>&1 | tee release-build.log

      # No Apple Developer ID yet: the app is signed "ad hoc" (required to run on Apple Silicon)
      # and the user opens it once with "Open Anyway". See README › Ücretsiz sürüm.
      - name: Sign ad hoc and package
        run: |
          APP=build/Build/Products/Release/PadTrack.app
          test -f "$APP/Contents/Resources/WebClient/index.html"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ARCHS_FOUND=$(lipo -archs "$APP/Contents/MacOS/PadTrack")
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "::notice title=package::$ZIP ($(du -h "$ZIP" | cut -f1)), archs: $ARCHS_FOUND"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "PadTrack $VERSION" --notes-file .github/release-notes.md $PRERELEASE

      - name: Report
        if: always()
        run: bash .github/scripts/annotate.sh release-tests.log release-build.log
